<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10291f">
  <meta name="description" content="A clear, professional live cricket scoring desk.">
  <title>CricketScore Pro — Match Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="CricketScore Pro home">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#c9f36a"/><path d="M25.8 9.8c-2.8-1.4-6.8-.2-8.5 3.4l-5 10.5c-1.1 2.4-.3 5 1.8 6.1 2.2 1.1 4.8.1 5.9-2.2l5.5-11.3c1.3-2.7 1.3-5.1.3-6.5Z" fill="#173b2c"/><path d="m18.6 12.5 7 3.4M15 20l7 3.4M12.5 26l6.7 3.2" stroke="#c9f36a" stroke-width="1.4" stroke-linecap="round"/></svg></span>
        <span class="brand-name">CricketScore<span>PRO</span></span>
      </a>
      <div class="sidebar-label">MATCH CENTER</div>
      <button class="nav-item active" data-page="desk"><span class="nav-icon">◉</span> Match desk <span class="live-dot"></span></button>
      <button class="nav-item" data-page="history"><span class="nav-icon">◷</span> Match history</button>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-tip"><div class="tip-ball">✳</div><strong>Every run counts.</strong><p>Keep your match moving with quick, accurate scoring.</p></div>
      <div class="sidebar-footer">CRICKETSCORE PRO <span>v1.0</span></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="mobile-menu icon-button" id="menuToggle" aria-label="Open menu">☰</button><div class="breadcrumb">Match center <span>/</span> <strong id="crumb">Match desk</strong></div></div>
        <div class="topbar-actions"><span class="saved-indicator" id="saveState"><i></i> Saved locally</span><button class="icon-button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button><button class="avatar" title="Local scorer">SC</button></div>
      </header>
      <div id="viewRoot" class="view-root"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script src="scoring.js"></script>
  <script src="app.js"></script>
</body>
</html>
